<style>
:root{
  --bg:#FFFFFF; --alt:#F3F5F7; --ink:#1B2433; --muted:#4A5565; --accent:#0F5B66; --accent-dark:#0A4650; --rule:#D9DEE4; --on-accent:#FFFFFF; --todo-bg:#FFF6DB; --todo-ink:#6B4E00;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12171F; --alt:#1A212B; --ink:#E6EAF0; --muted:#AAB4C2; --accent:#5FB7C2; --accent-dark:#7FCAD3; --rule:#2C3542; --on-accent:#0B1A1D; --todo-bg:#3A3015; --todo-ink:#F2D98A; } }
:root[data-theme="dark"]{ --bg:#12171F; --alt:#1A212B; --ink:#E6EAF0; --muted:#AAB4C2; --accent:#5FB7C2; --accent-dark:#7FCAD3; --rule:#2C3542; --on-accent:#0B1A1D; --todo-bg:#3A3015; --todo-ink:#F2D98A; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3","Open Sans",Arial,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:2px}
a:hover{color:var(--accent-dark)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img{max-width:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.measure{max-width:720px}

/* header */
header.site{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px);margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:64px;gap:16px}
.brand{font-weight:600;font-size:18px;color:var(--ink);text-decoration:none;white-space:nowrap}
nav.main ul{list-style:none;margin:0;padding:0;display:flex;gap:4px;flex-wrap:wrap}
nav.main a{display:block;padding:8px 10px;color:var(--ink);text-decoration:none;font-size:16px;border-bottom:2px solid transparent}
nav.main a:hover{color:var(--accent)}
nav.main a[aria-current="page"]{border-bottom-color:var(--accent);color:var(--accent)}
.menu-btn{display:none;background:none;border:1px solid var(--rule);color:var(--ink);font:inherit;font-size:16px;padding:8px 14px;border-radius:6px;min-height:44px;cursor:pointer}
@media (max-width:900px){
  .menu-btn{display:block}
  nav.main{display:none;position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--rule)}
  nav.main.open{display:block}
  nav.main ul{flex-direction:column;padding:8px 24px 16px}
  nav.main a{padding:12px 0;border-bottom:1px solid var(--rule)}
  nav.main a[aria-current="page"]{border-bottom-color:var(--rule);font-weight:600}
}

/* sections */
section.band{padding:64px 0}
section.band.alt{background:var(--alt)}
@media (max-width:700px){section.band{padding:40px 0}}
h1,h2,h3{line-height:1.25;margin:0}
h1{font-size:32px;font-weight:600;margin-bottom:24px}
h2{font-size:24px;font-weight:600;margin-bottom:20px}
h2::before{content:"";display:block;width:40px;height:2px;background:var(--accent);margin-bottom:14px}
h3{font-size:19px;font-weight:600;margin:28px 0 8px}
p{margin:0 0 16px}
.meta{color:var(--muted);font-size:15px}
.more{display:inline-block;margin-top:28px;font-weight:600}
.todo{background:var(--todo-bg);color:var(--todo-ink);padding:0 4px;border-radius:3px;font-size:.92em}

/* hero */
.hero{display:grid;grid-template-columns:240px 1fr;gap:48px;align-items:start;padding:56px 0 64px}
.hero img{width:240px;aspect-ratio:4/5;object-fit:cover;border-radius:8px;display:block}
.hero .name{font-size:36px;font-weight:700;line-height:1.15;margin:0 0 16px}
.pos{margin:0 0 14px}
.pos b{display:block;font-weight:600}
.pos span{display:block;color:var(--muted)}
.hero .intro{margin-top:20px;max-width:680px}
.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:6px;font-weight:600;font-size:16px;text-decoration:none;border:1px solid var(--accent);color:var(--accent);background:transparent}
.btn:hover{border-color:var(--accent-dark);color:var(--accent-dark)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-dark);color:var(--on-accent)}
.btn.disabled{opacity:.55;pointer-events:none}
@media (max-width:760px){
  .hero{grid-template-columns:1fr;gap:24px;padding:32px 0 40px}
  .hero img{width:160px}
  .hero .name{font-size:28px}
}

/* research statement: the one distinctive element */
.statement{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:48px;align-items:start}
.statement .lead{font-size:30px;font-weight:600;line-height:1.2;letter-spacing:-.01em}
.layers{list-style:none;padding:0;margin:24px 0 0;border-top:1px solid var(--rule)}
.layers li{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--rule)}
.layers b{font-weight:600;color:var(--accent)}
@media (max-width:800px){.statement{grid-template-columns:1fr;gap:16px}.statement .lead{font-size:24px}.layers li{grid-template-columns:1fr;gap:2px}}

/* themes */
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 40px}
.themes h3{margin:0 0 6px;font-size:18px}
.themes p{margin:0;color:var(--muted);font-size:16px}
.themes.full{grid-template-columns:repeat(2,minmax(0,1fr))}
.themes.full p{color:var(--ink);font-size:17px}
@media (max-width:900px){.themes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.themes,.themes.full{grid-template-columns:1fr}}

/* project cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.card{background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:24px;display:flex;flex-direction:column}
.card h3{margin:0 0 8px;font-size:18px}
.card p{font-size:16px;margin:0 0 16px}
.card dl{margin:auto 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;border-top:1px solid var(--rule);padding-top:12px}
.card dt{color:var(--muted)}
.card dd{margin:0}
.status{font-weight:600}

/* publications */
ol.pubs,ul.pubs{list-style:none;padding:0;margin:0}
.pubs li{padding:12px 0 12px 28px;text-indent:-28px;border-bottom:1px solid var(--rule)}
.pubs li:last-child{border-bottom:0}
.pubs .t{font-weight:400}
.pubs .v{font-style:italic}
.year{font-size:15px;font-weight:600;color:var(--muted);margin:28px 0 4px}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:8px 0 24px}
.filters input{flex:1 1 260px;min-height:44px;padding:0 14px;font:inherit;font-size:16px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:40px;padding:0 12px;font:inherit;font-size:15px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.count{color:var(--muted);font-size:15px;margin-bottom:8px}

/* tables & lists */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{text-align:left;vertical-align:top;padding:10px 16px 10px 0;border-bottom:1px solid var(--rule)}
th{font-weight:600;color:var(--muted);font-size:15px}
td:first-child{white-space:nowrap;color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:120px 1fr;gap:20px;padding:16px 0;border-bottom:1px solid var(--rule)}
.timeline .yr{color:var(--muted);font-weight:600}
@media (max-width:600px){.timeline li{grid-template-columns:1fr;gap:2px}}
ul.plain{padding-left:20px;margin:0 0 16px}
ul.plain li{margin-bottom:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px}
@media (max-width:760px){.two{grid-template-columns:1fr;gap:32px}}
.svc{margin:0 0 20px}
.svc b{font-weight:600}
.profiles{display:flex;flex-wrap:wrap;gap:10px}

footer{background:var(--alt);border-top:1px solid var(--rule);padding:40px 0;font-size:15px;color:var(--muted)}
footer b{color:var(--ink);font-weight:600}
footer p{margin:0 0 8px}
footer .links a{margin-right:14px}
.view{display:none}
.view.active{display:block}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

<script>const PHOTO_SRC = "assets/photo.jpg"; const SITE = window.SITE;</script>
<script>
(function(){
const S = SITE, L = S.links;
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// allow <b> in curated strings; mark placeholders
const rich = s => String(s).replace(/\[(Information to be added|year to be added)\]/g,'<span class="todo">[$1]</span>');
const txt = s => rich(esc(s));
const bold = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const cvLink = L.cvPdf ? `href="${esc(L.cvPdf)}" target="_blank" rel="noopener"` : `href="#cv"`;
const ext = (url, label, cls="btn") => url ? `<a class="${cls}" href="${esc(url)}" target="_blank" rel="noopener">${label}</a>` : "";

const PAGES = [
  ["home","Home"],["about","About"],["research","Research"],["publications","Publications"],
  ["teaching","Teaching"],["service","Service"],["students","Students"],["cv","CV"],["contact","Contact"]
];

function cite(p){
  const doi = p.doi ? ` <a href="https://doi.org/${esc(p.doi)}" target="_blank" rel="noopener">doi:${esc(p.doi)}</a>` : "";
  return `<li>${bold(p.authors)}, “<span class="t">${esc(p.title)}</span>,” <span class="v">${esc(p.venue)}</span>, ${p.year}.${doi}</li>`;
}
function card(p){
  return `<article class="card"><h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p>
  <dl><dt>Role</dt><dd>${esc(p.role)}</dd><dt>Funding</dt><dd>${esc(p.funder)}</dd>
  <dt>Amount</dt><dd>${esc(p.amount)}</dd><dt>Period</dt><dd>${txt(p.period)}</dd>
  <dt>Area</dt><dd>${esc(p.area)}</dd><dt>Status</dt><dd class="status">${esc(p.status)}</dd></dl></article>`;
}
const band = (inner, alt) => `<section class="band${alt?" alt":""}"><div class="wrap">${inner}</div></section>`;
const profileButtons = () => [ext(L.scholar,"Google Scholar"),ext(L.orcid,"ORCID"),ext(L.researchgate,"ResearchGate"),ext(L.linkedin,"LinkedIn")].join("");

const views = {
home(){
  const pos = S.positions.map(p=>`<p class="pos"><b>${esc(p.title)}</b><span>${esc(p.unit)}</span><span>${esc(p.org)}</span></p>`).join("");
  const sel = S.publications.filter(p=>p.selected).sort((a,b)=>b.year-a.year);
  return `<div class="wrap"><div class="hero">
    <img src="${PHOTO_SRC}" alt="${esc(S.photoAlt)}">
    <div><h1 class="name">${esc(S.name)}</h1>${pos}
      <p class="intro">${esc(S.intro)}</p>
      <div class="buttons">
        <a class="btn primary" href="#research">Research</a>
        <a class="btn primary" href="#publications">Publications</a>
        ${ext(L.scholar,"Google Scholar")}${ext(L.orcid,"ORCID")}
        <a class="btn" ${cvLink}>CV</a>
        <a class="btn" href="#contact">Contact</a>
      </div></div></div></div>`
  + band(`<div class="statement"><div><h2>Research focus</h2><p class="lead">${esc(S.statement.title)}</p></div>
      <div><p>${esc(S.statement.text)}</p>
      <ul class="layers"><li><b>Sense</b><span>Wearable, textile and low-cost embedded sensors</span></li>
      <li><b>Process</b><span>Biomedical signal processing and feature extraction</span></li>
      <li><b>Learn</b><span>Machine learning for screening and monitoring</span></li>
      <li><b>Apply</b><span>Healthcare and assistive technology in resource-constrained settings</span></li></ul></div></div>`, true)
  + band(`<h2>Research themes</h2><div class="themes">${S.themes.map(t=>`<div><h3>${esc(t.title)}</h3><p>${esc(t.short)}</p></div>`).join("")}</div>
      <a class="more" href="#research">More about the research</a>`)
  + band(`<h2>Selected funded projects</h2><div class="cards">${S.projects.filter(p=>p.featured).map(card).join("")}</div>
      <a class="more" href="#research">All projects</a>`, true)
  + band(`<h2>Selected publications</h2><div class="measure"><ol class="pubs">${sel.map(cite).join("")}</ol></div>
      <a class="more" href="#publications">View all publications</a>`)
  + band(`<div class="two"><div><h2>Teaching</h2><p>${esc(S.teachingSnapshot)}</p><a class="more" href="#teaching">Teaching</a></div>
      <div><h2>Academic leadership</h2><p>${esc(S.leadershipSnapshot)}</p><a class="more" href="#service">Service</a></div></div>`, true)
  + band(`<div class="two"><div><h2>Scholarly profiles</h2><div class="profiles">${profileButtons()}</div></div>
      <div><h2>Contact</h2><p>${S.contact.lines.map(esc).join("<br>")}<br><a href="mailto:${esc(L.email)}">${esc(L.email)}</a></p>
      <a class="btn primary" href="mailto:${esc(L.email)}">Contact me</a></div></div>`);
},
about(){
  return band(`<h1>About</h1><div class="measure"><h2>Academic profile</h2>${S.about.map(p=>`<p>${esc(p)}</p>`).join("")}</div>
    <h2 style="margin-top:40px">Education</h2><ul class="timeline">${S.education.map(e=>`<li><span class="yr">${esc(e.years)}</span><div><b>${esc(e.degree)}</b><br>${esc(e.inst)}<br><span class="meta">${esc(e.note)}</span></div></li>`).join("")}</ul>
    <h2 style="margin-top:40px">Academic appointments</h2><div class="tablewrap"><table><thead><tr><th>Period</th><th>Position</th><th>Institution</th></tr></thead><tbody>
    ${S.appointments.map(a=>`<tr><td>${esc(a[0])}</td><td>${esc(a[1])}</td><td>${esc(a[2])}</td></tr>`).join("")}</tbody></table></div>
    <div class="two" style="margin-top:40px"><div><h2>Research interests</h2><p>${esc(S.interests)}</p>
      <h2 style="margin-top:32px">Professional affiliations</h2><ul class="plain">${S.affiliations.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></div>
    <div><h2>Awards and recognition</h2><ul class="plain">${S.awards.map(a=>`<li>${txt(a)}</li>`).join("")}</ul></div></div>`);
},
research(){
  return band(`<h1>Research</h1><div class="measure"><h2>Research vision</h2><p>${esc(S.vision)}</p></div>`)
  + band(`<h2>Research themes</h2><div class="themes full">${[...S.themes,{title:S.extraTheme.title,short:"",long:S.extraTheme.long}].map(t=>`<div><h3>${esc(t.title)}</h3><p>${esc((t.short?t.short+" ":"")+t.long)}</p></div>`).join("")}</div>`, true)
  + band(`<h2>Funded research projects</h2><div class="cards">${S.projects.map(card).join("")}</div>`)
  + band(`<div class="two"><div><h2>Ongoing research directions</h2><ul class="plain">${S.directions.map(d=>`<li>${esc(d)}</li>`).join("")}</ul></div>
      <div><h2>Collaborations</h2><ul class="plain">${S.collaborations.map(c=>`<li>${c}</li>`).join("")}</ul></div></div>`, true)
  + band(`<div class="measure"><h2>Past research</h2><ul class="plain">${S.pastResearch.map(d=>`<li>${esc(d)}</li>`).join("")}</ul></div>`);
},
publications(){
  return band(`<h1>Publications</h1><p class="measure">Journal articles, conference papers and abstracts, newest first. For citation metrics and full texts, see
    ${ext(L.scholar,"Google Scholar","")}, ${ext(L.orcid,"ORCID","")} and ${ext(L.researchgate,"ResearchGate","")}.</p>
    <div class="filters"><input id="q" type="search" placeholder="Search titles, authors or venues" aria-label="Search publications">
    <div class="seg" role="group" aria-label="Publication type">
      <button data-t="all" aria-pressed="true">All</button><button data-t="journal" aria-pressed="false">Journal articles</button>
      <button data-t="conference" aria-pressed="false">Conference papers</button><button data-t="abstract" aria-pressed="false">Abstracts</button>
      <button data-t="review" aria-pressed="false">Under review</button></div></div>
    <div id="publist" class="measure" style="max-width:860px"></div>`);
},
teaching(){
  return band(`<h1>Teaching</h1><div class="measure"><h2>Teaching philosophy</h2>${S.teachingPhilosophy.map(p=>`<p>${esc(p)}</p>`).join("")}</div>`)
  + band(`<h2>Courses and laboratories</h2><p class="meta">Taught at Southeast University, ULAB and MIST. Course codes: <span class="todo">[Information to be added]</span></p>
      <div class="themes">${S.courses.map(c=>`<div><h3>${esc(c.area)}</h3><ul class="plain">${c.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div>`, true)
  + band(`<div class="measure"><h2>Workshops and seminars delivered</h2><ul class="plain">${S.workshops.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>
      <h2 style="margin-top:32px">Teaching resources</h2><p>Course materials are shared with enrolled students through the university's learning platform. Public lecture notes and tutorials: <span class="todo">[Information to be added]</span></p></div>`);
},
service(){
  return band(`<h1>Academic service and leadership</h1><p class="measure">${esc(S.serviceIntro)}</p>`
    + S.service.map(g=>`<h2 style="margin-top:40px">${esc(g.group)}</h2><div class="measure">${g.items.map(i=>`<p class="svc"><b>${esc(i[0])}</b>${i[1]?` <span class="meta">(${esc(i[1])})</span>`:""}${i[2]?`<br>${esc(i[2])}`:""}</p>`).join("")}</div>`).join(""));
},
students(){
  const s=S.students;
  return band(`<h1>Students</h1><div class="measure"><h2>Supervision and mentoring</h2><p>${esc(s.intro)}</p>
    <h3>Current students</h3><p>${txt(s.current)}</p><h3>Completed students</h3><p>${txt(s.completed)}</p>
    <h2 style="margin-top:40px">Prospective students and research assistants</h2><p>${esc(s.prospective)}</p>
    <a class="btn primary" href="mailto:${esc(L.email)}">Email Dr. Sayeed Ud Doulah</a></div>`);
},
cv(){
  return band(`<h1>Curriculum vitae</h1><div class="measure"><p>The full curriculum vitae lists all appointments, grants, publications, service roles and professional activities.</p>
    ${L.cvPdf ? `<a class="btn primary" ${cvLink}>Download full CV (PDF)</a>` : `<span class="btn primary disabled" aria-disabled="true">Download full CV (PDF)</span><p class="meta" style="margin-top:12px"><span class="todo">[Add the Google Drive link to the CV in links.cvPdf]</span></p>`}
    <p class="meta" style="margin-top:16px">Last updated: ${esc(S.cvUpdated)}</p></div>`);
},
contact(){
  const c=S.contact;
  return band(`<h1>Contact</h1><div class="two"><div><p><b>${esc(S.name)}</b><br>${c.lines.map(esc).join("<br>")}</p>
    <p>Email: <a href="mailto:${esc(L.email)}">${esc(L.email)}</a><br>Office: ${txt(c.office)}<br>Office hours: ${txt(c.hours)}</p>
    <a class="btn primary" href="mailto:${esc(L.email)}">Contact me</a></div>
    <div><h2>Scholarly profiles</h2><div class="profiles">${profileButtons()}</div></div></div>`);
}
};

function renderPubs(){
  const box=document.getElementById("publist"); if(!box) return;
  const q=(document.getElementById("q").value||"").toLowerCase().trim();
  const t=document.querySelector('.seg button[aria-pressed="true"]').dataset.t;
  const names={journal:"Journal articles",conference:"Conference papers",abstract:"Abstracts and workshop presentations",review:"Manuscripts under review"};
  const list=S.publications.filter(p=>(t==="all"||p.type===t)&&(!q||(p.title+" "+p.authors+" "+p.venue+" "+p.year).toLowerCase().includes(q)));
  let html=`<p class="count" aria-live="polite">${list.length} ${list.length===1?"item":"items"}</p>`;
  for(const type of ["journal","conference","abstract","review"]){
    const g=list.filter(p=>p.type===type).sort((a,b)=>b.year-a.year); if(!g.length) continue;
    html+=`<h2 style="margin-top:32px">${names[type]}</h2>`;
    let yr=null, buf="";
    g.forEach(p=>{ if(p.year!==yr){ if(buf) html+=`<ul class="pubs">${buf}</ul>`; buf=""; yr=p.year; html+=`<p class="year">${yr}</p>`;} buf+=cite(p); });
    html+=`<ul class="pubs">${buf}</ul>`;
  }
  if(!list.length) html+=`<p>No publications match this search. Clear the search box or choose All.</p>`;
  box.innerHTML=html;
}

function show(){
  const id=(location.hash||"#home").slice(1);
  const page=views[id]?id:"home";
  document.getElementById("main").innerHTML=`<div class="view active">${views[page]()}</div>`;
  document.querySelectorAll("#navlist a").forEach(a=>{ if(a.dataset.p===page) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  const label=PAGES.find(p=>p[0]===page)[1];
  document.title = page==="home" ? document.title.replace(/^.*?\|/, S.name+" |") : `${label} | ${S.name}`;
  if(page==="publications"){
    document.getElementById("q").addEventListener("input",renderPubs);
    document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");renderPubs();}));
    renderPubs();
  }
  nav.classList.remove("open"); btn.setAttribute("aria-expanded","false");
  window.scrollTo(0,0);
}

document.getElementById("brand").textContent=S.shortName;
document.getElementById("navlist").innerHTML=PAGES.map(p=>`<li><a href="#${p[0]}" data-p="${p[0]}">${p[1]}</a></li>`).join("");
document.getElementById("footer").innerHTML=`<p><b>${esc(S.name)}</b></p>
  <p>${esc(S.positions[0].title)}, Department of EEE, ${esc(S.positions[0].org)}</p>
  <p>Research: ${esc(S.footerAreas)}</p>
  <p class="links">${[["Google Scholar",L.scholar],["ORCID",L.orcid],["ResearchGate",L.researchgate],["LinkedIn",L.linkedin]].filter(x=>x[1]).map(x=>`<a href="${esc(x[1])}" target="_blank" rel="noopener">${x[0]}</a>`).join("")}<a ${cvLink}>CV</a></p>
  <p>© ${new Date().getFullYear()} ${esc(S.name)}</p>`;
const nav=document.getElementById("nav"), btn=document.querySelector(".menu-btn");
btn.addEventListener("click",()=>{const o=nav.classList.toggle("open");btn.setAttribute("aria-expanded",o);});
window.addEventListener("hashchange",show);
show();
})();
</script>
